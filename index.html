<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ignition 2026</title>
    <link rel="stylesheet" href="style-new.css">
</head>

<body>
    <div class="page">

        <div class="nav">
            <ul class="nav-links">
                <li><a href="https://www.thrustmit.in/" target="_blank">Home</a></li>
                <li><a href="#gallery">Gallery</a></li>
            </ul>
            <span class="nav-place">Launch Pad</span>
        </div>

        <div class="header">
            <h1 class="title">IGNITION 2026</h1>
        </div>

        <div id="gallery">

            <div class="row">
                <div class="row-side">
                    <span class="time">T-06:00</span>
                    <p class="words">Rollout
                </div>
                <div class="row-images">
                    <img class="photo photo-big pos1" src="Images/rollout1.webp" alt="">
                    <img class="photo photo-small pos2" src="Images/rollout2.jpg" alt="">
                </div>
                <p class="row-note">Same sky<br>Different mission</p>
            </div>

            <div class="row">
                <div class="row-side">
                    <span class="time">T-00:10</span>
                    <p class="words">Hold
                </div>
                <div class="row-images">
                    <img class="photo photo-big pos3" src="Images/Count1.jpg" alt="">
                    <img class="photo photo-small pos4" src="Images/Count2.jpg" alt="">
                </div>
                <p class="row-note">Ten seconds<br>Ten thousand hours</p>
            </div>

            <div class="row">
                <div class="row-side">
                    <span class="time">T+00:00</span>
                    <p class="words">Ignition
                </div>
                <div class="row-images">
                    <img class="photo photo-big pos5" src="Images/Ignition1.jpeg" alt="">
                    <img class="photo photo-small pos6" src="Images/Ignition2.webp" alt="">
                </div>
                <p class="row-note">Chase the fire</p>
            </div>

            <div class="row text-dark">
                <div class="row-side">
                    <span class="time">T+02:30</span>
                    <p class="words">Ascent
                </div>
                <div class="row-images">
                    <img class="photo photo-big pos7" src="Images/Ascent1.jpeg" alt="">
                    <img class="photo photo-small pos8" src="Images/Ascent2.jpeg" alt="">
                </div>
                <p class="row-note">Thrust takes us to skies</p>
            </div>

        </div>

        <img class="rockets" src="images/rockets.svg" alt="">

    </div>
</body>

</html>
